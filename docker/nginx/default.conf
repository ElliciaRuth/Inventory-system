# Mirrors the production layout: the built Vue app at /, the API at /api

# First line of defence against request floods, before PHP runs: on average 20 API
# requests per second per client IP, with bursts up to 60. The app applies its own,
# finer limits too (backend/app/Config/RequestLimits.php).
limit_req_zone $binary_remote_addr zone=api_per_ip:10m rate=20r/s;
limit_conn_zone $binary_remote_addr zone=conn_per_ip:10m;

# Security headers for the web app. nginx drops server-level add_header lines in any
# location that sets its own, so each location below repeats them.
map $host $app_csp {
    default "default-src 'self'; script-src 'self'; style-src 'self'; style-src-attr 'unsafe-inline'; font-src 'self' data:; img-src 'self' data: blob:; connect-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'self'";
}

server {
    listen 80;
    server_name _;
    # Don't advertise the nginx version
    server_tokens off;
    # Largest upload (Excel import, backup restore); the app allows 40 MB, 1 MB for other requests
    client_max_body_size 45M;
    client_body_timeout 60s;

    root /var/www/frontend/dist;
    index index.html;

    location = /index.html {
        add_header Cache-Control "no-store";
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;
        add_header Content-Security-Policy $app_csp always;
    }

    location / {
        try_files $uri $uri/ /index.html;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;
        add_header Content-Security-Policy $app_csp always;
    }

    # Finished-product and batch barcode SVGs generated by the backend
    location /barcodes/ {
        alias /var/www/backend/public/barcodes/;
        # Images only: even a tampered SVG opened directly can't run scripts
        add_header Content-Security-Policy "default-src 'none'; style-src 'unsafe-inline'; sandbox" always;
        add_header X-Content-Type-Options "nosniff" always;
    }

    location /api {
        limit_req zone=api_per_ip burst=60 nodelay;
        limit_req_status 429;
        limit_conn conn_per_ip 30;
        limit_conn_status 429;

        root /var/www/backend/public;
        rewrite ^/api/(.*)$ /index.php/$1 break;

        include fastcgi_params;
        fastcgi_pass php:9000;
        fastcgi_param SCRIPT_FILENAME $document_root/index.php;
        fastcgi_param REQUEST_URI $request_uri;
        fastcgi_param QUERY_STRING $query_string;
        fastcgi_read_timeout 300;
    }
}
